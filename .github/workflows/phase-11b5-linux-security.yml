name: Phase 11B.5 Linux security acceptance

on:
  push:
    branches: [feature/phase-11b5-linux-security-acceptance]
  pull_request:
    branches: [feature/phase-11b2-distributed-admission-verification]

permissions:
  contents: read

jobs:
  postgres-admission:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/test-session-admission-linux.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
