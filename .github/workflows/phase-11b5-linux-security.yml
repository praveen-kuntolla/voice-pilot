name: Phase 11B.5 Linux security acceptance

on:
  push:
    branches: [feature/phase-11b5-linux-security-acceptance, feature/phase-11b6-transaction-security-acceptance, feature/phase-11c-durable-usage-safety, feature/phase-12a-browser-voice-preparation, feature/phase-12a1-voice-flow-integration, feature/phase-12a2-browser-e2e-acceptance, feature/phase-12a3-postgres-voice-gateway, feature/phase-12a4-postgres-adapter-acceptance]
  pull_request:
    branches: [feature/phase-11b2-distributed-admission-verification, feature/phase-11b6-transaction-security-acceptance, feature/phase-11c-durable-usage-safety, feature/phase-12a-browser-voice-preparation, feature/phase-12a1-voice-flow-integration, feature/phase-12a2-browser-e2e-acceptance, feature/phase-12a3-postgres-voice-gateway]

permissions:
  contents: read

jobs:
  postgres-admission:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: node scripts/test-session-admission-linux.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
